<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скачать Лаунчер</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070a0e;
            --card-bg: #131a20;
            --accent-green: #00ff66;
            --accent-green-hover: #00cc52;
            --text-main: #ffffff;
            --border-color: #1f2933;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- АНИМИРОВАННЫЙ ФОН (СЕТКА И КУБИКИ) --- */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            /* Сетка */
            background-image: 
                linear-gradient(to right, rgba(0, 255, 102, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 255, 102, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Летающие кубики */
        .cube {
            position: absolute;
            border: 2px solid rgba(0, 255, 102, 0.4);
            background: rgba(0, 255, 102, 0.05);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            animation: float linear infinite;
        }

        .cube-1 { width: 80px; height: 80px; top: 15%; left: 20%; animation-duration: 15s; }
        .cube-2 { width: 50px; height: 50px; top: 60%; left: 75%; animation-duration: 20s; animation-direction: reverse; }
        .cube-3 { width: 120px; height: 120px; top: 70%; left: 10%; animation-duration: 25s; border-width: 1px; opacity: 0.5; }
        .cube-4 { width: 40px; height: 40px; top: 30%; left: 85%; animation-duration: 12s; }
        .cube-5 { width: 100px; height: 100px; top: 85%; left: 50%; animation-duration: 18s; animation-direction: reverse; }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
            50% { transform: translateY(-80px) rotate(180deg); opacity: 0.8; }
            100% { transform: translateY(0) rotate(360deg); opacity: 0.2; }
        }

        /* --- ЦЕНТРАЛЬНЫЙ БЛОК С КНОПКОЙ --- */
        .download-box {
            position: relative;
            z-index: 10;
            background-color: rgba(19, 26, 32, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 50px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
        }

        .download-box h1 {
            font-size: 28px;
            margin-bottom: 25px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* Кнопка скачивания */
        .download-btn {
            display: block;
            width: 100%;
            background-color: var(--accent-green);
            color: #000;
            text-align: center;
            padding: 18px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
            transition: all 0.2s ease;
        }

        .download-btn:hover {
            background-color: var(--accent-green-hover);
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.6);
            transform: translateY(-2px);
        }

        .download-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <!-- АНИМИРОВАННЫЙ ФОН -->
    <div class="background-container">
        <div class="cube cube-1"></div>
        <div class="cube cube-2"></div>
        <div class="cube cube-3"></div>
        <div class="cube cube-4"></div>
        <div class="cube cube-5"></div>
    </div>

    <!-- ЦЕНТРАЛЬНАЯ КНОПКА -->
    <div class="download-box">
        <h1>Скачать Лаунчер</h1>
        
        <!-- ВАША ССЫЛКА НА ЯНДЕКС.ДИСК -->
        <a href="https://disk.yandex.ru/d/pnwC605sg57xHA" target="_blank" rel="noopener noreferrer" class="download-btn">
            Скачать
        </a>
    </div>

</body>
</html>
